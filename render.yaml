# Blueprint Render — dépôt serveur AUTONOME (racine = ce dossier)
# IMPORTANT : ne pas définir de "Root Directory" dans le dashboard Render.
services:
  - type: web
    name: saas-game-dev-social
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Décommentez avec un disque persistant (plan payant) pour conserver SQLite :
      # - key: SOCIAL_DATA_DIR
      #   value: /var/data/social
    # disk:
    #   name: social-data
    #   mountPath: /var/data
    #   sizeGB: 1
